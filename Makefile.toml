#
# Static checks
#

[tasks.format-check]
workspace = false
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.clippy-default]
description = "Clippy with the default feature set"
command = "cargo"
args = ["clippy", "--all-targets", "--", "--deny=warnings"]

[tasks.clippy-mdns]
description = "Clippy with LAN discovery enabled, so the mDNS-gated code is linted too"
workspace = false
command = "cargo"
args = [
  "clippy",
  "--features",
  "kitsune2/mdns,kitsune2_transport_iroh/mdns",
  "--all-targets",
  "--",
  "--deny=warnings",
]

[tasks.clippy]
description = "Run clippy in every feature configuration that gates code"
workspace = false
dependencies = ["clippy-default", "clippy-mdns"]

[tasks.format-toml-check]
description = "Check that all TOML files are formatted correctly"
workspace = false
dependencies = ["install-taplo"]
command = "taplo"
args = ["format", "--check"]

[tasks.doc-check]
description = "Check documetation generation, similarly to how docs.rs will do it"
script_runner = "@shell"
script = '''
${CARGO_NIGHTLY:-cargo +nightly} doc --all-features --no-deps
'''
env = { RUSTDOCFLAGS = "--cfg docsrs --deny=warnings" }
install_crate = false

#
# Tests
#

[tasks.test-default]
description = "Run the tests with the default feature set"
command = "cargo"
args = ["test"]

[tasks.test-metrics]
description = "Run the tests with the iroh transport's `metrics` feature enabled"
workspace = false
command = "cargo"
args = ["test", "-p", "kitsune2_transport_iroh", "--features", "metrics"]

[tasks.test-mdns]
description = "Run the tests with LAN discovery enabled, so the mDNS-gated tests are compiled and run"
workspace = false
command = "cargo"
args = ["test", "--features", "kitsune2/mdns,kitsune2_transport_iroh/mdns"]

[tasks.test]
description = "Run the tests in every feature configuration that gates code"
workspace = false
dependencies = ["test-default", "test-metrics", "test-mdns"]

[tasks.bench-build]
description = "Build all benchmarks without running them so they don't bit-rot"
command = "cargo"
args = ["bench", "--no-run"]

[tasks.bench]
description = "Run all benchmarks across the workspace"
command = "cargo"
args = ["bench"]

#
# Tasks that modify content and are not run on CI
#

[tasks.format]
workspace = false
command = "cargo"
args = ["fmt"]

[tasks.proto]
workspace = false
command = "cargo"
args = ["run", "--package", "tool_proto_build"]
cwd = "crates/tool_proto_build"

[tasks.format-toml]
workspace = false
dependencies = ["install-taplo"]
command = "taplo"
args = ["format"]

#
# Helper tasks
#

[tasks.static-fmt]
description = "Formatting checks only, with no compilation"
workspace = false
dependencies = ["format-toml-check", "format-check"]

[tasks.static]
description = "Run all static checks"
workspace = false
dependencies = [
  "format-toml-check",
  "format-check",
  "clippy",
  "doc-check",
  "bench-build",
]

[tasks.verify]
description = "Run all static checks and tests"
workspace = false
dependencies = ["static", "test"]

[tasks.fix]
description = "Run all tasks to format, generate and tidy"
workspace = false
dependencies = ["format", "proto", "format-toml"]

[tasks.default]
alias = "verify"

#
# Other
#

[tasks.install-taplo]
workspace = false
description = "Install taplo-cli"
install_crate = { crate_name = "taplo-cli", version = "0.9.3", binary = "taplo", test_arg = "--help" }

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
# Require at least this cargo-make version
min_version = "0.37.23"

#
# Improve performance by disabling features we don't need
#

# Skip loading of all core tasks which saves up a bit on toml parsing and task creation
skip_core_tasks = true
# Skips loading Git related environment variables
skip_git_env_info = true
# Skips loading rust related environment variables
skip_rust_env_info = true
