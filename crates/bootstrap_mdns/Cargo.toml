[package]
name = "kitsune2_bootstrap_mdns"
version.workspace = true
description = "mDNS-based LAN peer discovery for kitsune2"
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/kitsune2_bootstrap_mdns"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[dependencies]
kitsune2_api = { workspace = true }
mdns-sd = "0.19"
# enumerates the interface addresses named in our announcement
if-addrs = "0.15"
flume = { version = "0.11", default-features = false, features = ["async"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
hex = "0.4"
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
bytes = { workspace = true }
kitsune2_api = { workspace = true, features = ["mockall"] }
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[features]
schema = ["dep:schemars"]
