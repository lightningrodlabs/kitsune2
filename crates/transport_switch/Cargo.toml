[package]
name = "kitsune2_transport_switch"
description = "Runtime-selectable multi-backend transport for kitsune2"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
bytes = { workspace = true }
kitsune2_api = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
kitsune2_core = { workspace = true }
kitsune2_gossip = { workspace = true }
kitsune2_transport_broadcast = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
schema = ["dep:schemars"]
