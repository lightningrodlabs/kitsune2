[package]
name = "kitsune2"
version.workspace = true
description = "p2p / dht communication framework api"
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/kitsune2"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[[example]]
name = "schema"
required-features = ["schema"]

[dependencies]
bytes = { workspace = true }
kitsune2_api = { workspace = true }
kitsune2_bootstrap_mdns = { workspace = true, optional = true }
kitsune2_core = { workspace = true }
kitsune2_gossip = { workspace = true }
kitsune2_transport_iroh = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }

# Feature: schema
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
kitsune2_gossip = { workspace = true }
kitsune2_test_utils = { workspace = true }
kitsune2_transport_iroh = { workspace = true, features = ["test-utils"] }
rand = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
jsonschema = { workspace = true }
tracing = { workspace = true }

[features]
default = ["transport-iroh"]

# Use the iroh transport
transport-iroh = ["dep:kitsune2_transport_iroh"]

# LAN discovery: the mDNS bootstrap crate, plus the iroh transport's own
# mDNS address lookup so that the peers it finds are dialable without a
# relay.
mdns = ["dep:kitsune2_bootstrap_mdns", "kitsune2_transport_iroh?/mdns"]

schema = [
  "dep:schemars",
  "dep:serde_json",
  "kitsune2_core/schema",
  "kitsune2_gossip/schema",
  "kitsune2_transport_iroh?/schema",
  "kitsune2_bootstrap_mdns?/schema",
]
